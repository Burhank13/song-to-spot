<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Songs to Spotify</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Songs to Spotify</h1>
        <p class="subtitle">Save what's playing to a playlist</p>
      </header>

      <section id="auth-section">
        <button id="connect-btn" type="button">Connect Spotify</button>
        <button id="disconnect-btn" type="button" class="secondary hidden">
          Disconnect
        </button>
      </section>

      <section id="playlist-section" class="hidden">
        <label for="playlist-select">Target playlist</label>
        <select id="playlist-select">
          <option value="">Select a playlist…</option>
        </select>
        <button id="refresh-playlists-btn" type="button" class="secondary">
          Refresh playlists
        </button>
      </section>

      <section id="pick-section" class="hidden">
        <h2>Which song is this?</h2>
        <p id="pick-detected" class="muted"></p>
        <ul id="pick-list" class="list"></ul>
        <button id="dismiss-btn" type="button" class="secondary">None of these</button>
      </section>

      <section id="status-section">
        <h2>Now playing</h2>
        <p id="track-title" class="muted">Looking…</p>
        <p id="track-artist" class="muted"></p>
        <button id="save-btn" type="button" class="hidden" disabled>
          Add to playlist
        </button>
        <p id="shortcut-hint" class="hint"></p>
        <p id="last-result" class="result"></p>
      </section>

      <section id="history-section" class="hidden">
        <h2>Recent</h2>
        <ul id="history-list" class="list history"></ul>
      </section>

      <p id="error" class="error hidden"></p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
